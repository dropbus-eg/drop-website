server {
    listen 80;
    listen [::]:80;
    server_name dropeg.com www.dropeg.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dropeg.com www.dropeg.com;

    ssl_certificate /etc/letsencrypt/live/dropeg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dropeg.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dropeg-website;
    index index.html;

    error_page 404 /404.html;

    location ^~ /drafts/ {
        return 404;
    }

    location ^~ /site-src/ {
        return 404;
    }

    location ^~ /DROP-WEBSITE/ {
        return 404;
    }

    location = / {
        return 302 /en/;
    }

    location = /assets/downloads/DROP-Schools-1.0.6.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="DROP-Schools-1.0.6.apk"';
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
